name: MACD-V WPRBB Signal

on:
  repository_dispatch:
    types: [run-dmi-alert]
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test Telegram message (1 = yes)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: mv-wpr-signal
  cancel-in-progress: false

jobs:
  check-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event.inputs.test }}
        run: python dmi_alert.py

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "dmi-alert-bot"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --quiet --cached || git commit -m "update state"
          git push
